<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Premier · CloudyCat</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Inter:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <!-- Écran de chargement : visible jusqu'à l'arrivée des données -->
  <div class="loader" id="loader" role="status" aria-live="polite">
    <div class="loader-box">
      <span class="eyebrow">CloudyCat</span>
      <strong class="loader-title">Premier</strong>
      <div class="loader-bar"><span></span></div>
      <span class="loader-text" id="loader-text">Connexion</span>
    </div>
  </div>

  <!-- Écran de connexion -->
  <section class="login" id="login" hidden>
    <div class="login-box">
      <p class="eyebrow">CloudyCat</p>
      <h1>Premier</h1>
      <p class="login-text">Strats, compos et matchs de l'équipe. Accès réservé aux membres Premier du serveur.</p>
      <p class="login-error" id="login-error" hidden></p>
      <a class="btn btn-primary" href="/api/login">Se connecter avec Discord</a>
    </div>
  </section>

  <!-- Application -->
  <div class="app" id="app" hidden>
    <header class="top">
      <div class="brand">
        <span class="eyebrow">CloudyCat</span>
        <strong>Premier</strong>
      </div>
      <nav class="tabs" role="tablist">
        <button class="tab" role="tab" data-view="accueil">Accueil</button>
        <button class="tab" role="tab" data-view="equipe">Équipe</button>
        <button class="tab" role="tab" data-view="maps">Maps</button>
        <button class="tab" role="tab" data-view="compos">Compos</button>
        <button class="tab" role="tab" data-view="entrainements">Entraînements</button>
        <button class="tab" role="tab" data-view="matchs">Matchs</button>
      </nav>
      <div class="user">
        <img class="avatar" id="user-avatar" alt="" hidden>
        <span id="user-name"></span>
        <button class="link" id="logout" type="button">Déconnexion</button>
      </div>
    </header>

    <p class="demo-banner" id="demo-banner" hidden>Mode démo : les données restent dans ce navigateur.</p>

    <main class="view" id="view"></main>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="js/donnees.js"></script>
  <script src="js/api.js"></script>
  <script src="js/tableau.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
